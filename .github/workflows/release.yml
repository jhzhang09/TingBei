name: Release IPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "包名后缀标签（留空则使用 manual-run_number）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package-ipa:
    name: Archive & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Independent State Machine Checks
        run: |
          swift -DPACE_CHECKS TingBei/Pace.swift

      - name: Determine Version Label
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            LABEL="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            LABEL="${{ inputs.tag }}"
          else
            LABEL="manual-${{ github.run_number }}"
          fi
          SAFE_LABEL="${LABEL//\//-}"
          echo "label=${SAFE_LABEL}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=TingBei-${SAFE_LABEL}.ipa" >> "$GITHUB_OUTPUT"

      - name: Archive iOS App & Widget Extension (Unsigned)
        run: |
          xcodebuild -project TingBei.xcodeproj \
            -scheme TingBei \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TingBei.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package .ipa
        run: |
          APP_DIR="build/TingBei.xcarchive/Products/Applications/TingBei.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Error: $APP_DIR not found"
            exit 1
          fi
          if [ ! -d "$APP_DIR/PlugIns/TingBeiWidgets.appex" ]; then
            echo "Error: TingBeiWidgets.appex not found inside TingBei.app/PlugIns"
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_DIR" build/ipa/Payload/
          (cd build/ipa && zip -qry "../${{ steps.meta.outputs.ipa_name }}" Payload)
          ls -lh "build/${{ steps.meta.outputs.ipa_name }}"

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ipa_name }}
          path: build/${{ steps.meta.outputs.ipa_name }}
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/${{ steps.meta.outputs.ipa_name }}" \
            --clobber
